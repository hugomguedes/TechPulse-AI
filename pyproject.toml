[project]
name = "techpulse-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hugomguedes", email = ""},
    { name = "alex-guima", email = "alexandreagtaveira@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
techpulse-ai = "techpulse_ai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
