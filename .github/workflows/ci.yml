name: CI Workflow

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "dev"]

env:
  PYTHON_VERSION: '3.14'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync && uv add flake8

      - name: Run Flake8 linter
        run: uv run flake8 ./src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --python ${{ matrix.python-version }} && uv add pytest

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync && uv add bandit

      - name: Run Bandit security scan
        run: uv run bandit -r ./src -f json -o bandit_report.json -n 3 -lll

      - name: Verify Bandit actually scanned the source tree
        run: |
          python - <<'PY'
          import json
          import sys

          with open("bandit_report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          scanned = sorted(name for name in report.get("metrics", {}) if name != "_totals")
          errors = report.get("errors", [])

          for error in errors:
              print(f"::error::Bandit could not scan {error.get('filename')}: {error.get('reason')}")

          if not scanned:
              print("::error::Bandit scanned no files. Check that the scan target still exists.")
              sys.exit(1)

          print(f"Bandit scanned {len(scanned)} file(s).")

          if errors:
              sys.exit(1)
          PY

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit_report.json
